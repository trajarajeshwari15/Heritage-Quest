<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Bharat Quest - Adventure</title>

    <style>
        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: linear-gradient(135deg, #10182f, #19345c);
            color: white;
            text-align: center;
        }

        .container {
            padding: 70px 20px;
        }

        h1 {
            font-size: 50px;
        }

        h2 {
            font-size: 28px;
            margin-bottom: 40px;
        }

        .worlds {
            display: flex;
            justify-content: center;
            gap: 25px;
            flex-wrap: wrap;
        }

        .world {
            background: white;
            color: black;
            width: 220px;
            padding: 30px 15px;
            border-radius: 20px;
            font-size: 22px;
            font-weight: bold;
            cursor: pointer;
        }

        .world:hover {
            transform: scale(1.05);
        }

        .emoji {
            font-size: 55px;
            margin-bottom: 15px;
        }
    </style>
</head>

<body>

    <div class="container">

        <h1>🇮🇳 Bharat Quest</h1>

        <h2>Choose Your Adventure</h2>

        <div class="worlds">

            <div class="world">
                <div class="emoji">🏺</div>
                Ancient India
            </div>

            <div class="world">
                <div class="emoji">👑</div>
                Great Kingdoms
            </div>

            <div class="world">
                <div class="emoji">🇮🇳</div>
                Freedom Quest
            </div>

            <div class="world">
                <div class="emoji">🎭</div>
                Culture Explorer
            </div>

            <div class="world">
                <div class="emoji">🎉</div>
                Festival Challenge
            </div>

            <div class="world">
                <div class="emoji">🏛️</div>
                Monument Mystery
            </div>

        </div>

    </div>

</body>

</html>
